# consultas bono 
sql.insert.crearBono = INSERT INTO Bono (emailJugador, fechaCreacion, fechaCaducidad, sesionesRestantes, tipoBono) VALUES (?, ?, ?, ?, ?)
sql.insert.reservaSQL = INSERT INTO Reserva (emailJugador, fechaHoraReserva, duracionMinutos, nombrePista, precio, descuento, numAdultos, numNinos) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
sql.update.hacerReservaBono = UPDATE Bono SET sesionesRestantes = ? WHERE idBono = ?
sql.select.buscarBonoPorJugador = SELECT idBono, fechaCreacion, tipoBono FROM Bono WHERE emailJugador = ? AND sesionesRestantes > 0

# consultas jugador
sql.insert.agregarJugador = INSERT INTO Jugador (email, nombre, apellidos, fechaNacimiento, fechaInscripcion) VALUES (?, ?, ?, ?, ?)
sql.select.listarJugadores = SELECT * FROM Jugador
sql.update.modificarJugador = UPDATE Jugador SET nombre = ?, apellidos = ?, fechaNacimiento = ?, email = ? WHERE email = ?
sql.select.buscarJugadorPorCorreo = SELECT * FROM Jugador WHERE email = ?

# consultas material
sql.insert.insertarMaterial = INSERT INTO Material (idMaterial, tipo, usoExterior, estado) VALUES (?, ?, ?, ?)
sql.select.obtenerMaterialPorID = SELECT * FROM Material WHERE idMaterial = ?
sql.select.obtenerMaterialesDisponibles = SELECT * FROM Material WHERE estado = 'DISPONIBLE'
sql.update.actualizarEstadoMaterial = UPDATE Material SET estado = ? WHERE idMaterial = ?

# consultas pista
sql.insert.insertarPista = INSERT INTO Pista (nombre, disponible, esExterior, tamano, maxJugadores) VALUES (?, ?, ?, ?, ?)
sql.select.obtenerTodasLasPistas = SELECT * FROM Pista
sql.select.cargarMaterialesDePista = SELECT m.idMaterial, m.tipo, m.usoExterior, m.estado FROM Material m JOIN Pista_Material pm ON m.idMaterial = pm.idMaterial WHERE pm.nombrePista = ?
sql.insert.asociarMaterialAPista = INSERT INTO Pista_Material (nombrePista, idMaterial) VALUES (?, ?)
sql.delete.eliminarMaterialDePista = DELETE FROM Pista_Material WHERE nombrePista = ? AND idMaterial = ?
sql.select.obtenerPistaConMateriales = SELECT * FROM Pista WHERE nombre = ?

# consultas reserva
sql.insert.hacerReservaIndividual = INSERT INTO Reserva (emailJugador, fechaHoraReserva, duracionMinutos, nombrePista, precio, descuento, numAdultos, numNinos) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
sql.update.modificarReserva = UPDATE Reserva SET fechaHoraReserva = ?, duracionMinutos = ? WHERE emailJugador = ? AND fechaHoraReserva = ?
sql.delete.cancelarReserva = DELETE FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva = ?
sql.select.contarReservasFuturas = SELECT COUNT(*) FROM Reserva WHERE fechaHoraReserva > ?
sql.select.listarReservasPorFechaYPista = SELECT * FROM Reserva WHERE DATE(fechaHoraReserva) = ? AND nombrePista = ?
sql.select.encontrarReservaPorJugador = SELECT * FROM Reserva WHERE emailJugador = ? ORDER BY fechaHoraReserva DESC LIMIT 1