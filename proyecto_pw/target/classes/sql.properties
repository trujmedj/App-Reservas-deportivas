# consultas bono 
sql.insert.crearBono = INSERT INTO Bono (emailJugador, fechaCreacion, fechaCaducidad, sesionesRestantes, tipoBono) VALUES (?, ?, ?, ?, ?)
sql.insert.reservaBono = INSERT INTO Reserva (emailJugador, fechaHoraReserva, duracionMinutos, nombrePista, precio, descuento, numAdultos, numNinos, bono) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
sql.update.hacerReservaBono = UPDATE Bono SET sesionesRestantes = ? WHERE idBono = ?
sql.select.buscarBonoPorJugador = SELECT idBono, fechaCreacion, tipoBono FROM Bono WHERE emailJugador = ? AND sesionesRestantes > 0
sql.select.obtenerBonosPorJugador = SELECT idBono, fechaCreacion, tipoBono, sesionesRestantes, fechaCaducidad FROM Bono WHERE emailJugador = ?
sql.select.buscarBonoPorJugadorYTipo = SELECT idBono, fechaCreacion, tipoBono, sesionesRestantes, fechaCaducidad FROM Bono WHERE emailJugador = ? AND tipoBono = ? AND sesionesRestantes > 0
sql.delete.eliminarBono = DELETE FROM Bono WHERE idBono = ?
sql.delete.eliminarReserva=DELETE FROM Reserva WHERE fechaHoraReserva = ? AND nombrePista = ?



# consultas jugador
sql.insert.agregarJugador = INSERT INTO Jugador (email, nombre, apellidos, fechaNacimiento, fechaInscripcion, contrasena, rol) VALUES (?, ?, ?, ?, ?, ?, ?)
sql.select.listarJugadores = SELECT * FROM Jugador
sql.update.modificarJugador = UPDATE Jugador SET nombre = ?, apellidos = ?, fechaNacimiento = ?, email = ?, contrasena = ?, rol = ? WHERE email = ?
sql.select.buscarJugadorPorCorreo = SELECT * FROM Jugador WHERE email = ?
sql.select.verificarUsuario = SELECT COUNT(*) FROM Jugador WHERE email = ? AND contrasena = ?


# consultas material
sql.insert.insertarMaterial = INSERT INTO Material (idMaterial, tipo, usoExterior, estado) VALUES (?, ?, ?, ?)
sql.select.obtenerMaterialPorID = SELECT * FROM Material WHERE idMaterial = ?
sql.select.obtenerMaterialesDisponibles = SELECT * FROM Material WHERE estado = 'DISPONIBLE'
sql.update.actualizarEstadoMaterial = UPDATE Material SET estado = ? WHERE idMaterial = ?
sql.select.obtenerTodosLosMateriales = SELECT * FROM Material

# consultas pista
sql.insert.insertarPista = INSERT INTO Pista (nombre, disponible, esExterior, tamano, maxJugadores) VALUES (?, ?, ?, ?, ?)
sql.select.obtenerTodasLasPistas = SELECT * FROM Pista
sql.select.cargarMaterialesDePista = SELECT m.idMaterial, m.tipo, m.usoExterior, m.estado FROM Material m JOIN Pista_Material pm ON m.idMaterial = pm.idMaterial WHERE pm.nombrePista = ?
sql.insert.asociarMaterialAPista = INSERT INTO Pista_Material (nombrePista, idMaterial) VALUES (?, ?)
sql.delete.eliminarMaterialDePista = DELETE FROM Pista_Material WHERE nombrePista = ? AND idMaterial = ?
sql.select.obtenerPistaConMateriales = SELECT * FROM Pista WHERE nombre = ?
sql.select.buscarPistasPorTipoYFecha = SELECT * FROM Pista WHERE esExterior = ? AND disponible = TRUE
sql.update.modificarEstadoPista = UPDATE Pista SET disponible = ? WHERE nombre = ?
sql.select.buscarPistasDisponibles = SELECT * FROM Pista WHERE disponible = TRUE

# consultas reserva
sql.insert.hacerReservaIndividual = INSERT INTO Reserva (emailJugador, fechaHoraReserva, duracionMinutos, nombrePista, precio, descuento, numAdultos, numNinos, bono) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
sql.update.modificarReservaMini = UPDATE Reserva SET fechaHoraReserva = ?, duracionMinutos = ? WHERE emailJugador = ? AND fechaHoraReserva = ?
sql.delete.cancelarReserva = DELETE FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva = ?
sql.select.contarReservasFuturas = SELECT COUNT(*) FROM Reserva WHERE fechaHoraReserva > ?
sql.select.listarReservasPorFechaYPista = SELECT * FROM Reserva WHERE DATE(fechaHoraReserva) = ? AND nombrePista = ?
sql.select.encontrarReservaPorJugador = SELECT * FROM Reserva WHERE emailJugador = ? ORDER BY fechaHoraReserva DESC LIMIT 1
sql.select.obtenerProximaReserva = SELECT * FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva > ? ORDER BY fechaHoraReserva ASC LIMIT 1
sql.select.listarReservasEntreFechas = SELECT * FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva BETWEEN ? AND ?
sql.select.contarReservasCompletadas = SELECT COUNT(*) FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva <= ?
sql.delete.eliminarReservasFuturas = DELETE FROM Reserva WHERE fechaHoraReserva > ?
sql.select.listarReservasModificables = SELECT * FROM Reserva WHERE emailJugador = ? AND fechaHoraReserva > ?
sql.update.modificarReserva = UPDATE Reserva SET fechaHoraReserva = ?, duracionMinutos = ?, nombrePista = ?, numAdultos = ?, numNinos = ? WHERE emailJugador = ? AND fechaHoraReserva = ?


    